{% extends "base.html" %}
{% block contenido %}
<h2>Editar gasto</h2>
<form method="post">
  <input name="descripcion" value="{{ gasto.descripcion }}">
  <input name="monto" type="number" step="0.01" value="{{ gasto.monto }}">
  <input name="categoria" value="{{ gasto.categoria }}">
  <input name="fecha" type="date" value="{{ gasto.fecha }}">
  <button>Guardar</button>
</form>
<p><a href="{{ url_for('index') }}">Volver</a></p>
{% endblock %}
